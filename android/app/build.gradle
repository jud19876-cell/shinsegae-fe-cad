plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def propVersionCode = project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
def propVersionName = project.hasProperty('versionName') ? project.property('versionName').toString() : "1.2.0"

android {
    namespace 'com.shinsegaefood.fecad'
    compileSdk 34

    defaultConfig {
        applicationId "com.shinsegaefood.fecad"
        minSdk 26
        targetSdk 34
        versionCode propVersionCode
        versionName propVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('release-key.jks')
            storePassword (System.getenv("KEYSTORE_PASSWORD") ?: "ssgfe2026!")
            keyAlias (System.getenv("KEY_ALIAS") ?: "fecadkey")
            keyPassword (System.getenv("KEY_PASSWORD") ?: "ssgfe2026!")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
